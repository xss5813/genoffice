# .github/workflows/docker-minimal.yml
name: Build Minimal Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [minimal, ultra-minimal]
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.minimal
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-latest
            ghcr.io/${{ github.repository }}:${{ matrix.variant }}-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Key optimization flags
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          # Squash layers to reduce size
          provenance: false
          sbom: false
